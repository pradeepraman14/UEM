services:
  postgres:
    image: postgres:16-alpine
    container_name: uem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uem}
      POSTGRES_USER: ${POSTGRES_USER:-uem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uem_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uem_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: uem_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uem}:${POSTGRES_PASSWORD:-uem_secret}@postgres:5432/${POSTGRES_DB:-uem}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    volumes:
      - ./pki/ca:/app/pki/ca:ro
      - agent_packages:/app/packages
      - audit_logs:/app/logs
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  celery_worker:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: uem_celery
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uem}:${POSTGRES_PASSWORD:-uem_secret}@postgres:5432/${POSTGRES_DB:-uem}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    volumes:
      - ./pki/ca:/app/pki/ca:ro
      - agent_packages:/app/packages
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: uem_celery_beat
    restart: unless-stopped
    depends_on:
      - celery_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uem}:${POSTGRES_PASSWORD:-uem_secret}@postgres:5432/${POSTGRES_DB:-uem}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    command: celery -A app.workers.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./server/frontend
      dockerfile: Dockerfile
    container_name: uem_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: uem_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./pki/ca/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./pki/ca/server.key:/etc/nginx/ssl/server.key:ro
      - ./pki/ca/ca.crt:/etc/nginx/ssl/ca.crt:ro
      - nginx_logs:/var/log/nginx

volumes:
  postgres_data:
  redis_data:
  agent_packages:
  audit_logs:
  nginx_logs:
