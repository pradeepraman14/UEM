[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uem-agent"
version = "1.0.0"
description = "UEM Windows Agent"
requires-python = ">=3.11"

dependencies = [
    # Windows service
    "pywin32==306; sys_platform == 'win32'",

    # WebSocket
    "websockets==12.0",

    # HTTP client
    "httpx[http2]==0.27.0",

    # Windows management (Windows only)
    "wmi==1.5.1; sys_platform == 'win32'",

    # System info (cross-platform for dev)
    "psutil==5.9.8",

    # Cryptography
    "cryptography==42.0.7",

    # Config & logging
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "structlog==24.2.0",

    # Utilities
    "python-dateutil==2.9.0",
    "aiofiles==23.2.1",
    "orjson==3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
