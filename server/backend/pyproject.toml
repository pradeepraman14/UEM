[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uem-backend"
version = "1.0.0"
description = "UEM Orchestration Platform - Backend API"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "starlette==0.37.2",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # Redis / Queue
    "redis[hiredis]==5.0.4",
    "celery[redis]==5.4.0",
    "kombu==5.3.7",

    # Auth / Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==42.0.7",

    # Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",

    # HTTP client
    "httpx==0.27.0",

    # Utilities
    "python-dateutil==2.9.0",
    "pytz==2024.1",
    "aiofiles==23.2.1",
    "orjson==3.10.3",
    "Pillow==10.3.0",

    # Reporting
    "reportlab==4.1.0",
    "openpyxl==3.1.2",
    "pandas==2.2.2",

    # Email
    "aiosmtplib==3.0.1",
    "jinja2==3.1.4",

    # Logging
    "structlog==24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.0.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
